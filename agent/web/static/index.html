<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OIBoard Agent</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('agent_theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">

    <!-- Header -->
    <header class="card header-bar animate-in">
      <div class="brand-group">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="brand-meta">
          <div class="brand-title-row">
            <h1 class="brand-title">OIBoard Agent</h1>
            <span class="chip mono">:2054</span>
            <span id="agent-status-badge" class="status-badge ok">
              <span class="dot"></span>运行中
            </span>
          </div>
          <p class="brand-sub">本地代码统计 · 事件驱动</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-scan-inc" class="btn btn-primary" title="增量扫描">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          </svg>
          <span>增量扫描</span>
        </button>
        <button id="btn-scan-full" class="btn btn-secondary" title="全量重扫">全量重扫</button>
        <button id="theme-toggle" class="btn btn-icon" title="切换外观" aria-label="切换深浅色模式">
          <svg id="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Row 1: KPI Cards -->
    <section class="kpi-grid animate-in" style="animation-delay: 40ms;">
      <div class="card kpi-card">
        <div class="kpi-head">
          <span>总代码行数</span>
          <span class="chip">LOC</span>
        </div>
        <div class="kpi-value-row">
          <span id="stat-total-lines" class="kpi-value mono">0</span>
          <span class="kpi-unit">行</span>
        </div>
        <div class="kpi-foot mono">.c · .cpp · .java</div>
      </div>

      <div class="card kpi-card">
        <div class="kpi-head">
          <span>今日变动</span>
          <span class="chip ok">TODAY</span>
        </div>
        <div class="kpi-value-row">
          <span id="stat-today-lines" class="kpi-value mono accent-green">+0</span>
          <span class="kpi-unit">行</span>
        </div>
        <div class="kpi-foot">
          <span id="stat-today-files" class="mono">0 个文件</span>
        </div>
      </div>

      <div class="card kpi-card">
        <div class="kpi-head">
          <span>源码文件</span>
          <span class="chip info">FILES</span>
        </div>
        <div class="kpi-value-row">
          <span id="stat-total-files" class="kpi-value mono">0</span>
          <span class="kpi-unit">个</span>
        </div>
        <div class="kpi-foot">已建立索引</div>
      </div>

      <div class="card kpi-card">
        <div class="kpi-head">
          <span>语言分布</span>
          <span class="chip">LANG</span>
        </div>
        <div class="lang-rows mono">
          <div class="lang-row">
            <span class="lang-tag c">C</span>
            <span><b id="stat-c-lines">0</b> <span id="stat-c-files" class="muted">0</span></span>
          </div>
          <div class="lang-row">
            <span class="lang-tag cpp">C++</span>
            <span><b id="stat-cpp-lines">0</b> <span id="stat-cpp-files" class="muted">0</span></span>
          </div>
          <div class="lang-row">
            <span class="lang-tag java">Java</span>
            <span><b id="stat-java-lines">0</b> <span id="stat-java-files" class="muted">0</span></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Row 2: Folders & Cloud Sync -->
    <section class="panel-grid animate-in" style="animation-delay: 80ms;">
      <!-- Folders -->
      <div class="card panel">
        <div class="panel-head">
          <div class="panel-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <h2>监控目录</h2>
          </div>
          <button type="button" id="btn-browse-folder" class="btn btn-secondary btn-sm">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>选择文件夹</span>
          </button>
        </div>

        <div class="sub-box">
          <input id="new-folder-path" type="text" placeholder="输入路径，如 ~/Projects/OI" class="input mono">
          <div class="inline-row">
            <input id="new-folder-name" type="text" placeholder="别名（可选）" class="input">
            <button id="btn-add-folder" class="btn btn-primary shrink-0">添加</button>
          </div>
        </div>

        <div id="folder-list-container" class="folder-list"></div>
      </div>

      <!-- Sync Config -->
      <div class="card panel">
        <div class="panel-head">
          <div class="panel-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 16 12 12 8 16"></polyline>
              <line x1="12" y1="12" x2="12" y2="21"></line>
              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
            </svg>
            <h2>云端同步</h2>
          </div>
          <span id="sync-status-badge" class="status-badge warn">待配置</span>
        </div>

        <div class="form-stack">
          <div class="field">
            <label class="label" for="cfg-server-url">服务器地址</label>
            <input id="cfg-server-url" type="text" placeholder="http://198.44.63.140:2053" class="input mono">
          </div>

          <div class="field">
            <div class="label-row">
              <label class="label" for="cfg-sync-token">同步 Token</label>
              <button type="button" id="btn-open-login-modal" class="link-btn">账号登录获取 →</button>
            </div>
            <input id="cfg-sync-token" type="password" placeholder="粘贴 Token 或点击右侧登录获取" class="input mono">
          </div>

          <div class="meta-strip">
            <span class="muted">上次同步</span>
            <span id="sync-last-time" class="mono strong">未同步</span>
          </div>

          <div class="action-row">
            <div class="btn-group">
              <button id="btn-test-conn" class="btn btn-secondary">测试连接</button>
              <button id="btn-save-cfg" class="btn btn-secondary">保存</button>
            </div>
            <button id="btn-sync-now" class="btn btn-primary">立即同步</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Row 3: Files Table -->
    <section class="card panel animate-in" style="animation-delay: 120ms;">
      <div class="panel-head wrap">
        <div class="panel-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <h2>文件明细</h2>
          <span id="file-count-label" class="chip mono">0</span>
        </div>

        <div class="table-tools">
          <div class="seg-group" role="tablist">
            <button class="filter-lang-btn active" data-lang="all">全部</button>
            <button class="filter-lang-btn" data-lang="c">C</button>
            <button class="filter-lang-btn" data-lang="cpp">C++</button>
            <button class="filter-lang-btn" data-lang="java">Java</button>
          </div>
          <input id="file-search" type="text" placeholder="搜索路径..." class="input mono search-input">
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 4.5rem;">#</th>
              <th>路径</th>
              <th style="width: 4.5rem;">语言</th>
              <th class="right" style="width: 6.5rem;">行数</th>
              <th class="right" style="width: 6.5rem;">大小</th>
              <th class="right" style="width: 11rem;">更新时间</th>
            </tr>
          </thead>
          <tbody id="file-list-body"></tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Login Modal (with CAPTCHA) -->
  <div id="login-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="login-modal-title">登录 OIBoard</h3>
        <button type="button" id="btn-modal-close" class="icon-close" aria-label="关闭">&times;</button>
      </div>

      <form id="login-form" class="form-stack">
        <div class="field">
          <label class="label" for="modal-username">用户名</label>
          <input id="modal-username" type="text" autocomplete="username" placeholder="输入用户名" class="input mono" required>
        </div>
        <div class="field">
          <label class="label" for="modal-password">密码</label>
          <input id="modal-password" type="password" autocomplete="current-password" placeholder="输入密码" class="input mono" required>
        </div>
        <div class="field">
          <label class="label" for="modal-captcha">验证码</label>
          <div class="captcha-row">
            <input id="modal-captcha" type="text" maxlength="6" autocomplete="off" placeholder="输入验证码" class="input mono captcha-input" required>
            <button type="button" id="btn-refresh-captcha" class="captcha-box" title="点击刷新验证码">
              <img id="modal-captcha-img" alt="验证码" style="display:none;">
              <span id="modal-captcha-placeholder" class="muted mono" style="font-size:11px;">加载中...</span>
            </button>
          </div>
        </div>
        <div id="modal-login-err" class="form-error" style="display:none;"></div>
        <div class="modal-foot">
          <button type="button" id="btn-modal-cancel" class="btn btn-secondary">取消</button>
          <button type="submit" id="btn-modal-login" class="btn btn-primary">登录并绑定</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
