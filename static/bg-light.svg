<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- macOS 15 Sequoia Luminous Optical Porcelain Backdrop (0% Idle CPU/GPU, 4K Vector Sharp) -->
    <linearGradient id="baseL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5e2f7"/>
      <stop offset="46%" stop-color="#e3ebf8"/>
      <stop offset="100%" stop-color="#d2def3"/>
    </linearGradient>

    <!-- High-Contrast Optical Caustics for Frosted Glass Refraction -->
    <radialGradient id="causticSapphireL" cx="14%" cy="14%" r="52%">
      <stop offset="0%" stop-color="#5b9bff" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#93bfff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e3ebf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticAquaL" cx="56%" cy="22%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.44"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e3ebf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticApricotL" cx="88%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#f6b676" stop-opacity="0.54"/>
      <stop offset="50%" stop-color="#fde3c4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e3ebf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticVioletL" cx="44%" cy="88%" r="58%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.48"/>
      <stop offset="52%" stop-color="#c7d2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d2def3" stop-opacity="0"/>
    </radialGradient>

    <!-- Sculpted Architectural Ribbon Folds -->
    <linearGradient id="foldL1" x1="6%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#5b9bff" stop-opacity="0.52"/>
      <stop offset="48%" stop-color="#a5c8ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#e3ebf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="foldL2" x1="100%" y1="10%" x2="12%" y2="92%">
      <stop offset="0%" stop-color="#f6b676" stop-opacity="0.44"/>
      <stop offset="46%" stop-color="#f7d8b5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e3ebf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="foldL3" x1="0%" y1="100%" x2="94%" y2="18%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.46"/>
      <stop offset="52%" stop-color="#b8c4fc" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#dce6f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Razor-thin Specular Bevel Crests -->
    <linearGradient id="ridgeL1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="68%" stop-color="#3b82f6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ridgeL2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="72%" stop-color="#d97706" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Algorithmic Iso-Contour Strokes -->
    <linearGradient id="contourL1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="26%" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="74%" stop-color="#9a6b38" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="contourL2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0"/>
      <stop offset="34%" stop-color="#4f46e5" stop-opacity="0.20"/>
      <stop offset="72%" stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="arcFadeL" cx="78%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#baseL)"/>
  <rect width="1920" height="1080" fill="url(#causticSapphireL)"/>
  <rect width="1920" height="1080" fill="url(#causticAquaL)"/>
  <rect width="1920" height="1080" fill="url(#causticApricotL)"/>
  <rect width="1920" height="1080" fill="url(#causticVioletL)"/>

  <!-- Sculpted Architectural Bevel Planes -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36 L2060,640 C1660,710 1320,432 840,582 C440,706 160,510 -120,650 Z" fill="url(#foldL1)"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564 L-120,1180 L2040,1180 Z" fill="url(#foldL2)"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564 L2060,1180 L-140,1180 Z" fill="url(#foldL3)"/>

  <!-- Crisp Specular Bevel Crests -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36" fill="none" stroke="url(#ridgeL1)" stroke-width="1.5"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564" fill="none" stroke="url(#ridgeL2)" stroke-width="1.4"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564" fill="none" stroke="url(#ridgeL1)" stroke-width="1.35"/>

  <!-- Subtle Geometric Optical Focal Arcs (Upper-Right Quadrant) -->
  <g fill="none" stroke="url(#arcFadeL)" stroke-width="0.95">
    <circle cx="1520" cy="220" r="240"/>
    <circle cx="1520" cy="220" r="340"/>
    <circle cx="1520" cy="220" r="440"/>
  </g>

  <!-- Algorithmic Parametric Iso-Contours -->
  <g fill="none" stroke="url(#contourL1)" stroke-width="0.9">
    <path d="M-80,118 C360,-20 740,256 1220,88 C1560,-30 1800,72 2020,-18"/>
    <path d="M-80,172 C350,28 730,300 1210,136 C1550,20 1790,116 2020,26"/>
    <path d="M-80,226 C340,76 720,344 1200,184 C1540,70 1780,160 2020,70"/>
    <path d="M-80,280 C330,124 710,388 1190,232 C1530,120 1770,204 2020,114"/>
    <path d="M-80,334 C320,172 700,432 1180,280 C1520,170 1760,248 2020,158"/>
  </g>

  <!-- Secondary Counter-Flow Iso-Contours -->
  <g fill="none" stroke="url(#contourL2)" stroke-width="0.88">
    <path d="M-100,822 C320,644 720,922 1200,744 C1560,610 1820,734 2040,624"/>
    <path d="M-100,876 C330,698 730,976 1210,798 C1570,664 1830,788 2040,678"/>
    <path d="M-100,930 C340,752 740,1030 1220,852 C1580,718 1840,842 2040,732"/>
    <path d="M-100,984 C350,806 750,1084 1230,906 C1590,772 1850,896 2040,786"/>
  </g>
</svg>
