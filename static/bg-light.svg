<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Pre-Diffused macOS 15 Sequoia Optical Porcelain Backdrop (Zero sharp lines, zero SVG filters, 0% idle GPU) -->
    <linearGradient id="baseL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e1f7"/>
      <stop offset="48%" stop-color="#e5edf9"/>
      <stop offset="100%" stop-color="#cfdcf3"/>
    </linearGradient>

    <!-- Softly Pre-Blurred Chromatic Light Pools -->
    <radialGradient id="causticSapphireL" cx="15%" cy="14%" r="58%">
      <stop offset="0%" stop-color="#4d92ff" stop-opacity="0.58"/>
      <stop offset="42%" stop-color="#8bbaff" stop-opacity="0.28"/>
      <stop offset="78%" stop-color="#cfe2ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e5edf9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticAquaL" cx="55%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="48%" stop-color="#bae6fd" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e5edf9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticApricotL" cx="88%" cy="18%" r="54%">
      <stop offset="0%" stop-color="#f6b676" stop-opacity="0.52"/>
      <stop offset="48%" stop-color="#fde3c4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e5edf9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticVioletL" cx="44%" cy="88%" r="62%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.46"/>
      <stop offset="52%" stop-color="#c7d2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cfdcf3" stop-opacity="0"/>
    </radialGradient>

    <!-- Sculpted Smooth Ribbon Folds with Multi-Stop Feathered Edges -->
    <linearGradient id="foldL1" x1="6%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#5b9bff" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#a5c8ff" stop-opacity="0.24"/>
      <stop offset="85%" stop-color="#e5edf9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e5edf9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="foldL2" x1="100%" y1="10%" x2="12%" y2="92%">
      <stop offset="0%" stop-color="#f6b676" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#f7d8b5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#e5edf9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="foldL3" x1="0%" y1="100%" x2="94%" y2="18%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.44"/>
      <stop offset="52%" stop-color="#b8c4fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#dce6f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Diffused Specular Glow Halos (Wide soft stroke mimicking pre-blurred frosted light) -->
    <linearGradient id="glowCrestL1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="70%" stop-color="#7eb3ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowCrestL2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.44"/>
      <stop offset="72%" stop-color="#f6b676" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#baseL)"/>
  <rect width="1920" height="1080" fill="url(#causticSapphireL)"/>
  <rect width="1920" height="1080" fill="url(#causticAquaL)"/>
  <rect width="1920" height="1080" fill="url(#causticApricotL)"/>
  <rect width="1920" height="1080" fill="url(#causticVioletL)"/>

  <!-- Sculpted Soft Optical Fold Planes -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36 L2060,640 C1660,710 1320,432 840,582 C440,706 160,510 -120,650 Z" fill="url(#foldL1)"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564 L-120,1180 L2040,1180 Z" fill="url(#foldL2)"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564 L2060,1180 L-140,1180 Z" fill="url(#foldL3)"/>

  <!-- Broad Diffused Crest Halos -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36" fill="none" stroke="url(#glowCrestL1)" stroke-width="26" stroke-linecap="round" opacity="0.55"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564" fill="none" stroke="url(#glowCrestL2)" stroke-width="24" stroke-linecap="round" opacity="0.5"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564" fill="none" stroke="url(#glowCrestL1)" stroke-width="22" stroke-linecap="round" opacity="0.45"/>
</svg>
