<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OIBoard - 算法刷题数据看板</title>
  <!-- 网站 Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0071e3', 600: '#0077ed' },
            dark: { 800: '#1c1c1e', 850: '#141416', 900: '#0c0c0e', 950: '#000000' }
          }
        }
      }
    }
  </script>
  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="/static/style.css?v=2.5.7">
</head>
<body :class="[isDark ? 'dark text-[#f5f5f7]' : 'text-[#1d1d1f]']" style="background-color: var(--bg-canvas);" class="min-h-screen antialiased flex overflow-x-hidden selection:bg-blue-500 selection:text-white transition-colors duration-300">
  <div id="app" v-cloak class="flex w-full min-h-screen">

    <!-- 初始会话验证过渡态 (杜绝已登录刷新时闪烁登录卡片) -->
    <div v-if="isAuthChecking" class="min-h-screen w-full flex flex-col items-center justify-center space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 shadow-lg shadow-cyan-500/10">
        <svg class="w-6 h-6 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
      </div>
      <div class="text-xs font-mono text-slate-400 tracking-wider animate-pulse">CONNECTING...</div>
    </div>

    <!-- ================= 未登录界面 ================= -->
    <div v-else-if="!isLoggedIn" class="min-h-screen w-full flex flex-col items-center justify-center p-4 relative">
      <!-- 登录页顶角昼夜外观切换器 -->
      <div class="absolute top-6 right-6">
        <div class="segmented-control" title="外观">
          <button @click="setThemePref('auto')" :class="['segmented-item text-xs', themePref === 'auto' ? 'active' : '']">
            <svg class="w-3.5 h-3.5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path>
            </svg>
            <span>自动</span>
          </button>
          <button @click="setThemePref('light')" :class="['segmented-item text-xs', themePref === 'light' ? 'active' : '']">
            <svg class="w-3.5 h-3.5 mr-1 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
            <span>浅色</span>
          </button>
          <button @click="setThemePref('dark')" :class="['segmented-item text-xs', themePref === 'dark' ? 'active' : '']">
            <svg class="w-3.5 h-3.5 mr-1 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span>深色</span>
          </button>
        </div>
      </div>

      <div class="ui-card w-full max-w-md p-8 space-y-6 relative border border-[var(--border-subtle)] shadow-2xl rounded-3xl">
        <!-- Logo & 系统名称 -->
        <div class="text-center space-y-2.5">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-500 shadow-sm">
            <svg class="w-7 h-7 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 16v4m6-10v10m6-7v7"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-[var(--text-primary)] font-sans tracking-tight">OIBoard</h1>
            <p class="text-xs text-[var(--text-secondary)] font-sans mt-1">算法刷题数据看板</p>
          </div>
        </div>

        <!-- 登录 / 注册 Tab 切换 (Apple Segmented Control) -->
        <div class="segmented-control w-full p-1">
          <button @click="authMode = 'login'; authError = ''" 
                  :class="['segmented-item flex-1 py-2 text-xs font-sans font-medium', authMode === 'login' ? 'active' : '']">
            登录
          </button>
          <button @click="authMode = 'register'; authError = ''" 
                  :class="['segmented-item flex-1 py-2 text-xs font-sans font-medium', authMode === 'register' ? 'active' : '']">
            注册
          </button>
        </div>

        <!-- 错误提示 -->
        <div v-if="authError" class="p-3 bg-rose-500/10 border border-rose-500/25 rounded-xl text-xs text-rose-600 dark:text-rose-400 flex items-center space-x-2 font-sans">
          <svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>{{ authError }}</span>
        </div>

        <!-- 表单区域 -->
        <form @submit.prevent="authMode === 'login' ? handleLogin() : handleRegister()" class="space-y-4 text-xs font-sans">
          <div>
            <label class="block text-[var(--text-secondary)] mb-1.5 font-medium">用户名</label>
            <input v-model="authForm.username" type="text" required placeholder="输入账号用户名 (3-32位)"
                   class="ui-input font-mono">
          </div>

          <div>
            <label class="block text-[var(--text-secondary)] mb-1.5 font-medium">密码</label>
            <input v-model="authForm.password" type="password" required placeholder="输入登录密码 (至少6位)"
                   class="ui-input font-mono">
          </div>

          <div v-if="authMode === 'register'">
            <label class="block text-[var(--text-secondary)] mb-1.5 font-medium">确认密码</label>
            <input v-model="authForm.confirmPassword" type="password" required placeholder="再次确认登录密码"
                   class="ui-input font-mono">
          </div>

          <div>
            <label class="block text-[var(--text-secondary)] mb-1.5 font-medium">验证码</label>
            <div class="flex items-center space-x-2">
              <input v-model="authForm.captcha_code" type="text" maxlength="6" required placeholder="验证码"
                     class="ui-input font-mono uppercase tracking-widest text-center flex-1">
              <div @click="fetchCaptcha" class="relative group cursor-pointer flex-shrink-0 h-[38px] w-[130px] rounded-xl overflow-hidden border border-[var(--border-subtle)] bg-[var(--bg-canvas)] flex items-center justify-center select-none shadow-sm transition-all hover:border-[var(--border-strong)]" title="点击刷新验证码">
                <img v-if="captchaImage" :src="captchaImage" alt="验证码" class="w-full h-full object-cover">
                <span v-else class="text-[10px] text-[var(--text-muted)] font-mono">加载中...</span>
                <div class="absolute inset-0 bg-black/25 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-white backdrop-blur-[1px]">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <button type="submit" :disabled="isAuthLoading"
                  class="btn-primary w-full py-2.5 flex items-center justify-center space-x-2 text-xs font-semibold mt-2 shadow-md">
            <svg v-if="isAuthLoading" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <span>{{ isAuthLoading ? '处理中...' : authMode === 'login' ? '立即登录' : '注册账号' }}</span>
          </button>
        </form>

        <div class="pt-2 text-center text-[11px] text-[var(--text-muted)] font-sans">
          <span>跨平台算法训练与数据看板</span>
        </div>
      </div>
    </div>

    <!-- ================= 已登录看板主界面 (Authenticated View) ================= -->
    <template v-if="isLoggedIn">

      <!-- Apple 极简伸缩侧边栏 -->
      <aside class="sidebar group fixed top-0 left-0 bottom-0 z-40 w-16 hover:w-60 bg-[var(--bg-sidebar)] backdrop-blur-xl border-r border-[var(--border-subtle)] flex flex-col justify-between transition-all duration-300 ease-in-out shadow-xl overflow-hidden select-none">
        
        <!-- 顶部 Logo 与系统名 -->
        <div>
          <div class="h-16 flex items-center px-3 border-b border-[var(--border-subtle)] space-x-3 overflow-hidden cursor-pointer" @click="currentTab = 'overview'">
            <div class="w-10 h-10 flex-shrink-0 rounded-xl bg-blue-500/10 border border-blue-500/25 flex items-center justify-center text-blue-500 shadow-sm">
              <svg class="w-5 h-5 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 16v4m6-10v10m6-7v7"></path>
              </svg>
            </div>
            <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap overflow-hidden">
              <div class="flex items-center space-x-1.5">
                <span class="text-sm font-bold font-mono tracking-tight text-[var(--text-primary)]">OIBoard</span>
              </div>
              <p class="text-[10px] text-[var(--text-tertiary)] font-sans">算法刷题数据看板</p>
            </div>
          </div>

          <!-- 侧边栏主菜单项 -->
          <nav class="p-2 space-y-1.5 mt-3">
            <!-- 1. 数据总览 -->
            <button @click="currentTab = 'overview'" 
                    :class="['w-full flex items-center h-11 px-3 rounded-xl text-xs font-medium transition-all group/item overflow-hidden font-sans',
                             currentTab === 'overview' ? 'bg-blue-500/12 text-blue-600 dark:text-blue-400 border border-blue-500/25 shadow-sm' : 'text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-black/[0.04] dark:hover:bg-white/[0.05]']">
              <svg class="w-5 h-5 flex-shrink-0" :class="currentTab === 'overview' ? 'text-blue-500' : 'text-[var(--text-tertiary)] group-hover/item:text-[var(--text-primary)]'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="6" height="6" rx="2"></rect>
                <rect x="14" y="4" width="6" height="6" rx="2"></rect>
                <rect x="4" y="14" width="6" height="6" rx="2"></rect>
                <rect x="14" y="14" width="6" height="6" rx="2"></rect>
              </svg>
              <span class="ml-3.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">数据总览</span>
            </button>

            <!-- 2. 比赛日历 -->
            <button @click="currentTab = 'contests'" 
                    :class="['w-full flex items-center h-11 px-3 rounded-xl text-xs font-medium transition-all group/item overflow-hidden font-sans',
                             currentTab === 'contests' ? 'bg-blue-500/12 text-blue-600 dark:text-blue-400 border border-blue-500/25 shadow-sm' : 'text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-black/[0.04] dark:hover:bg-white/[0.05]']">
              <svg class="w-5 h-5 flex-shrink-0" :class="currentTab === 'contests' ? 'text-blue-500' : 'text-[var(--text-tertiary)] group-hover/item:text-[var(--text-primary)]'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span class="ml-3.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap flex items-center justify-between flex-1">
                <span>比赛日历</span>
                <span v-if="upcomingContestsCount > 0" class="px-1.5 py-0.2 rounded text-[10px] bg-blue-500/20 text-blue-600 dark:text-blue-300 border border-blue-500/30 font-bold font-mono">{{ upcomingContestsCount }}</span>
              </span>
            </button>

            <!-- 3. 提交记录流 -->
            <button @click="currentTab = 'submissions'" 
                    :class="['w-full flex items-center h-11 px-3 rounded-xl text-xs font-medium transition-all group/item overflow-hidden font-sans',
                             currentTab === 'submissions' ? 'bg-blue-500/12 text-blue-600 dark:text-blue-400 border border-blue-500/25 shadow-sm' : 'text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-black/[0.04] dark:hover:bg-white/[0.05]']">
              <svg class="w-5 h-5 flex-shrink-0" :class="currentTab === 'submissions' ? 'text-blue-500' : 'text-[var(--text-tertiary)] group-hover/item:text-[var(--text-primary)]'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                <line x1="9" y1="12" x2="9.01" y2="12"></line>
                <line x1="13" y1="12" x2="16" y2="12"></line>
                <line x1="9" y1="16" x2="9.01" y2="16"></line>
                <line x1="13" y1="16" x2="16" y2="16"></line>
              </svg>
              <span class="ml-3.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap flex items-center justify-between flex-1">
                <span>提交记录</span>
                <span class="px-1.5 py-0.2 rounded text-[10px] bg-black/[0.04] dark:bg-white/[0.08] text-[var(--text-tertiary)] border border-[var(--border-subtle)] font-mono">{{ overview.stats.total_subs || 0 }}</span>
              </span>
            </button>

            <!-- 4. 待攻克错题集 -->
            <button @click="currentTab = 'mistakes'" 
                    :class="['w-full flex items-center h-11 px-3 rounded-xl text-xs font-medium transition-all group/item overflow-hidden font-sans',
                             currentTab === 'mistakes' ? 'bg-rose-500/12 text-rose-600 dark:text-rose-400 border border-rose-500/25 shadow-sm' : 'text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-black/[0.04] dark:hover:bg-white/[0.05]']">
              <svg class="w-5 h-5 flex-shrink-0" :class="currentTab === 'mistakes' ? 'text-rose-500' : 'text-[var(--text-tertiary)] group-hover/item:text-[var(--text-primary)]'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span class="ml-3.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap flex items-center justify-between flex-1">
                <span>错题集</span>
                <span v-if="mistakes.length > 0" class="px-1.5 py-0.2 rounded text-[10px] bg-rose-500/20 text-rose-600 dark:text-rose-300 border border-rose-500/30 font-mono">{{ mistakes.length }}</span>
              </span>
            </button>

            <!-- 5. 平台与系统设置 -->
            <button @click="currentTab = 'settings'" 
                    :class="['w-full flex items-center h-11 px-3 rounded-xl text-xs font-medium transition-all group/item overflow-hidden font-sans',
                             currentTab === 'settings' ? 'bg-blue-500/12 text-blue-600 dark:text-blue-400 border border-blue-500/25 shadow-sm' : 'text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-black/[0.04] dark:hover:bg-white/[0.05]']">
              <svg class="w-5 h-5 flex-shrink-0" :class="currentTab === 'settings' ? 'text-blue-500' : 'text-[var(--text-tertiary)] group-hover/item:text-[var(--text-primary)]'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
              </svg>
              <span class="ml-3.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">系统设置</span>
            </button>
          </nav>
        </div>

        <!-- 底部系统快捷状态与退出登录 -->
        <div class="p-2 border-t border-[var(--border-subtle)] space-y-1.5 overflow-hidden">
          <button @click="syncNow('all')" :disabled="isSyncing"
                  class="w-full flex items-center h-11 px-3 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 border border-blue-500/20 text-xs transition-all disabled:opacity-50 group/item overflow-hidden font-sans">
            <svg :class="['w-5 h-5 flex-shrink-0', isSyncing ? 'animate-spin' : '']" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <span class="ml-3.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap overflow-hidden">{{ isSyncing ? '正在同步...' : '同步全部' }}</span>
          </button>

          <button @click="handleLogout" 
                  class="w-full flex items-center h-11 px-3 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/20 text-xs transition-all group/item overflow-hidden font-sans">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            <span class="ml-3.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap overflow-hidden">退出登录</span>
          </button>
        </div>
      </aside>

      <!-- 主工作区 (Main Content Area, 左侧预留侧边栏间距) -->
      <main class="flex-1 ml-16 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full transition-all">

        <!-- 顶栏 (Apple Glassmorphism Navigation Bar) -->
        <header class="ui-card p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          <div class="flex items-center space-x-3">
            <div>
              <div class="flex items-center space-x-2.5">
                <h1 class="text-base font-bold tracking-tight font-sans text-[var(--text-primary)]">
                  {{ currentTab === 'overview' ? '数据总览' : 
                     currentTab === 'contests' ? '比赛日历' : 
                     currentTab === 'submissions' ? '提交记录' : 
                     currentTab === 'mistakes' ? '错题集' : '系统设置' }}
                </h1>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-sans font-semibold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">实时同步</span>
              </div>
            </div>
          </div>

          <!-- 右侧控制与状态区 -->
          <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto justify-between md:justify-end">
            <!-- 外观切换分段按钮 -->
            <div class="segmented-control" title="外观">
              <button @click="setThemePref('auto')" :class="['segmented-item', themePref === 'auto' ? 'active' : '']">
                <svg class="w-3.5 h-3.5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path>
                </svg>
                <span>自动</span>
              </button>
              <button @click="setThemePref('light')" :class="['segmented-item', themePref === 'light' ? 'active' : '']">
                <svg class="w-3.5 h-3.5 mr-1 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="5"></circle>
                  <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
                <span>浅色</span>
              </button>
              <button @click="setThemePref('dark')" :class="['segmented-item', themePref === 'dark' ? 'active' : '']">

                    <line x1="8" y1="2" x2="8" y2="6"></line>

                <button @click="contestFilter = 'atcoder'" :class="['segmented-item', contestFilter === 'atcoder' ? 'active' : '']">AtCoder</button>

                  <th class="px-4 py-3.5 w-44">开赛时间</th>
                  <th class="px-4 py-3.5 w-28">时长</th>
                  <th class="px-4 py-3.5 w-52">实时倒计时</th>
                  <th class="px-4 py-3.5 w-24 text-right">操作</th>

              </thead>
              <tbody class="divide-y divide-[var(--border-subtle)]">

                    <span :class="['px-2.5 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider',

                  <td class="px-4 py-3.5 font-medium text-[var(--text-primary)]">

                      <span class="font-semibold font-sans">{{ c.name }}</span>
                      <svg class="w-3.5 h-3.5 text-[var(--text-muted)] group-hover:text-blue-500 opacity-0 group-hover:opacity-100 transition-all flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <div v-if="getContestStatus(c) === 'CODING'" class="flex items-center space-x-1.5 text-rose-500 animate-pulse">

                      <span>{{ formatContestCountdown(c) }}</span>
                    </div>
                    <div v-else-if="getContestStatus(c) === 'BEFORE'" class="flex items-center space-x-1.5 text-blue-600 dark:text-blue-400">
                      <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                      <span>{{ formatContestCountdown(c) }}</span>
                    </div>
                    <div v-else class="text-[var(--text-muted)] font-sans">

                       <svg class="w-3 h-3 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                         <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                         <polyline points="15 3 21 3 21 9"></polyline>
                         <line x1="10" y1="14" x2="21" y2="3"></line>
                       </svg>
                    </a>
                  </td>
                </tr>

                <!-- 空数据提示 -->
                <tr v-if="filteredContests.length === 0">
                  <td colspan="7" class="px-4 py-12 text-center text-[var(--text-muted)] font-sans">

                      <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>

                  </td>
                </tr>
              </tbody>
            </table>
          </div>

                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>

                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>

              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[var(--text-tertiary)] text-[11px] font-medium">日期:</span>
                <div class="segmented-control">
                  <button @click="setDateFilter('all')" :class="['segmented-item text-[11px]', dateFilter === 'all' ? 'active' : '']">全部</button>
                  <button @click="setDateFilter('today')" :class="['segmented-item text-[11px]', dateFilter === 'today' ? 'active' : '']">今天</button>
                  <button @click="setDateFilter('7d')" :class="['segmented-item text-[11px]', dateFilter === '7d' ? 'active' : '']">近7天</button>
                  <button @click="setDateFilter('30d')" :class="['segmented-item text-[11px]', dateFilter === '30d' ? 'active' : '']">近30天</button>
                  <button @click="setDateFilter('year')" :class="['segmented-item text-[11px]', dateFilter === 'year' ? 'active' : '']">今年</button>
                </div>
              </div>

                <input type="date" v-model="endDate" @change="dateFilter = 'custom'"

                <label class="block text-[var(--text-tertiary)] text-[10px] mb-1 font-medium">搜索</label>

                  <td class="px-4 py-3 font-mono">
                    <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                      <span :class="['px-2 py-0.5 rounded-full text-[10px] font-bold border shrink-0',

                                     sub.platform === 'atcoder' ? 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/20' :
                                     sub.platform === 'luogu' ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20' : 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border-indigo-500/20']">

                      </span>
                    </div>

                  <td class="px-4 py-3 text-[var(--text-primary)] font-medium">
                    <div class="flex items-center space-x-2">
                      <span class="text-[var(--text-tertiary)] font-mono">[{{ sub.problem_id }}]</span>
                      <span>{{ sub.problem_title }}</span>

                  <td class="px-4 py-3 text-[var(--text-secondary)] font-mono">

                    <div class="flex flex-wrap gap-1 max-w-xs">

                  </td>
                  <td class="px-4 py-3 font-mono">
                    <span :class="['px-2 py-0.5 rounded-full text-[11px] font-bold border',
                                   sub.verdict === 'AC' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/30']">
                      {{ sub.verdict }}
                    </span>
                  </td>
                  <td class="px-4 py-3 text-[var(--text-secondary)] font-mono text-[11px]">
                    {{ sub.code_language || '-' }}

                  <td class="px-4 py-3 text-[var(--text-secondary)] font-mono text-[11px]" :title="sub.submitted_at">

                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                      </svg>

                </tr>
              </tbody>
            </table>

          </div>

        <!-- ================= TAB 3: 待攻克错题集 (MISTAKES) ================= -->

          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 pb-3 border-b border-[var(--border-subtle)]">
            <div>
              <h2 class="text-xs font-bold text-[var(--text-primary)] flex items-center space-x-2">
                <svg class="w-4 h-4 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>待攻克错题</span>
              </h2>
            </div>
            <span class="text-xs font-sans bg-rose-500/10 text-rose-600 dark:text-rose-400 font-semibold px-2.5 py-0.5 rounded-full border border-rose-500/20">

            </span>
          </div>

          <!-- 错题表格 -->
          <div class="overflow-x-auto rounded-xl border border-[var(--border-subtle)]">
            <table class="w-full text-left text-xs text-[var(--text-secondary)]">
              <thead class="text-[var(--text-tertiary)] bg-[var(--bg-subtle)] uppercase border-b border-[var(--border-subtle)] font-sans">
                <tr>
                  <th class="px-4 py-3">平台</th>
                  <th class="px-4 py-3">题目</th>
                  <th class="px-4 py-3">难度</th>
                  <th class="px-4 py-3">状态</th>
                  <th class="px-4 py-3">未通过次数</th>
                  <th class="px-4 py-3">最后尝试</th>
                  <th class="px-4 py-3 text-right">操作</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[var(--border-subtle)] font-sans">
                <tr v-for="item in mistakes" :key="item.platform + item.problem_id" class="hover:bg-black/[0.02] dark:hover:bg-white/[0.02] transition-colors">
                  <td class="px-4 py-3 font-mono">
                    <span :class="['px-2 py-0.5 rounded-full text-[10px] font-bold border', 
                                   item.platform === 'codeforces' ? 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20' :
                                   item.platform === 'atcoder' ? 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/20' :
                                   item.platform === 'luogu' ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20' : 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border-indigo-500/20']">
                      {{ item.platform === 'codeforces' ? 'CF' : item.platform === 'atcoder' ? 'ATCODER' : item.platform === 'luogu' ? 'LUOGU' : 'ACWING' }}
                    </span>
                  </td>
                  <td class="px-4 py-3 text-[var(--text-primary)] font-medium">
                    <div class="flex items-center space-x-2">
                      <span class="text-[var(--text-tertiary)] font-mono">[{{ item.problem_id }}]</span>
                      <span>{{ item.problem_title }}</span>
                    </div>
                  </td>
                  <td class="px-4 py-3 text-[var(--text-secondary)] font-mono">
                    <span class="px-2 py-0.5 rounded-full bg-[var(--bg-subtle)] text-[var(--text-secondary)] text-[11px] border border-[var(--border-subtle)]">{{ item.difficulty || '-' }}</span>
                  </td>
                  <td class="px-4 py-3 font-mono">
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-rose-500/15 text-rose-600 dark:text-rose-400 border border-rose-500/30">
                      {{ item.verdict }}
                    </span>
                  </td>
                  <td class="px-4 py-3 font-mono text-rose-600 dark:text-rose-400 font-bold">
                    {{ item.fail_times }} 次
                  </td>
                  <td class="px-4 py-3 text-[var(--text-secondary)] font-mono text-[11px]" :title="item.submitted_at">
                    {{ formatTimeAgo(item.submitted_at) }}
                  </td>
                  <td class="px-4 py-3 text-right font-sans">
                    <a v-if="item.submission_url" :href="item.submission_url" target="_blank"
                       class="text-blue-600 dark:text-blue-400 hover:opacity-80 text-xs hover:underline inline-flex items-center space-x-1 font-medium">
                      <span>去做题</span>
                      <svg class="w-3 h-3 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                      </svg>
                    </a>
                    <span v-else class="text-[var(--text-muted)] text-xs">-</span>
                  </td>
                </tr>
                <tr v-if="mistakes.length === 0">
                  <td colspan="7" class="px-4 py-12 text-center text-[var(--text-muted)] font-sans">
                    太棒了！暂无未攻克的错题
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ================= TAB 4: 平台设置与配置 (SETTINGS) ================= -->
        <div v-show="currentTab === 'settings'" class="ui-card p-6 space-y-6 font-sans">
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-[var(--border-subtle)]">
              <div>
                <h2 class="text-xs font-bold text-[var(--text-primary)] flex items-center space-x-2">
                  <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                  <span>平台账号与凭证</span>
                </h2>
              </div>

              <!-- 保存所有配置按钮 -->
              <div class="flex items-center space-x-2">
                <button @click="saveSettingsAndSync" :disabled="isSaving"
                        class="btn-primary text-xs flex items-center space-x-1.5 shadow-sm">
                  <svg :class="['w-3.5 h-3.5', isSaving ? 'animate-spin' : '']" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                  </svg>
                  <span>{{ isSaving ? '正在保存并同步...' : '保存并同步' }}</span>
                </button>
              </div>
            </div>

            <!-- 详细填表指引折叠面板 -->
            <div class="p-4 rounded-2xl bg-blue-500/8 border border-blue-500/20 text-xs space-y-2 text-blue-600 dark:text-blue-300">
              <div class="font-semibold flex items-center justify-between cursor-pointer" @click="showGuide = !showGuide">
                <span class="flex items-center space-x-2">
                  <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  <span>平台配置与获取指南 (点击{{ showGuide ? '收起' : '展开' }})</span>
                </span>
                <svg class="w-4 h-4 text-blue-500 transition-transform duration-200" :class="{ 'rotate-180': showGuide }" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
              <div v-if="showGuide" class="space-y-2 pt-2 border-t border-blue-500/15 text-[var(--text-secondary)] font-sans leading-relaxed text-xs">
                <div>
                  <b class="text-blue-600 dark:text-blue-400 font-sans">Codeforces:</b> 填写个人主页用户名 (Handle)，例如 <code class="bg-[var(--bg-surface)] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-primary)] font-mono">MCGA_WJJ</code>。
                </div>
                <div>
                  <b class="text-purple-600 dark:text-purple-400 font-sans">AtCoder:</b> 填写个人主页用户名 (Handle)，例如 <code class="bg-[var(--bg-surface)] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-primary)] font-mono">FarmingWAs</code>。
                </div>
                <div>
                  <b class="text-emerald-600 dark:text-emerald-400 font-sans">洛谷:</b>
                  <span>UID 为个人空间 URL 中的纯数字 (如 <code class="bg-[var(--bg-surface)] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-primary)] font-mono">1940760</code>)；Cookie 填入 <code class="bg-[var(--bg-surface)] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-primary)] font-mono">__client_id</code>。</span>
                </div>
                <div>
                  <b class="text-indigo-600 dark:text-indigo-400 font-sans">AcWing:</b>
                  <span>空间 ID 为个人空间地址栏数字 (如 <code class="bg-[var(--bg-surface)] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-primary)] font-mono">360946</code>)；Cookie 填入 <code class="bg-[var(--bg-surface)] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-primary)] font-mono">sessionid=xxxx</code>。</span>
                </div>
              </div>
            </div>

            <!-- 多账号平台配置看板 (4列 Apple 风格卡片，支持多账号绑定与自动去重) -->
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 items-stretch">
              <div v-for="p in platformMetaList" :key="p.id" 
                   class="p-5 rounded-2xl bg-[var(--bg-subtle)] border border-[var(--border-subtle)] flex flex-col justify-between h-full space-y-4 shadow-sm transition-all hover:border-[var(--border-bold)]">
                <!-- 卡片头部 -->
                <div class="space-y-3">
                  <div class="flex items-center justify-between pb-3 border-b border-[var(--border-subtle)]">
                    <div class="flex items-center space-x-2">
                      <span :class="['w-2 h-2 rounded-full shadow-sm', p.dotColor]"></span>
                      <span class="font-bold text-[var(--text-primary)] text-xs">{{ p.name }}</span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                      <span :class="['status-pill text-[10px] whitespace-nowrap shrink-0 max-w-[110px] truncate', getPlatformPillClass(p.id)]" 
                            :title="platformStatusMap[p.id]?.message">
                        {{ platformStatusMap[p.id]?.message || '未配置' }}
                      </span>
                    </div>
                  </div>

                  <!-- 账号列表容器 -->
                  <div class="space-y-2 min-h-[120px]">
                    <!-- 空状态 -->
                    <div v-if="!groupedAccounts[p.id] || groupedAccounts[p.id].length === 0" 
                         class="flex flex-col items-center justify-center py-7 px-3 text-center border border-dashed border-[var(--border-subtle)] rounded-xl bg-[var(--bg-surface)]/50">
                      <svg class="w-6 h-6 text-[var(--text-muted)] mb-1.5 stroke-[1.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path>
                      </svg>
                      <p class="text-[11px] text-[var(--text-tertiary)]">暂无绑定账号</p>
                      <p class="text-[10px] text-[var(--text-muted)] mt-0.5">支持主号与多个练习小号</p>
                    </div>

                    <!-- 账号卡片项 -->
                    <div v-for="acc in (groupedAccounts[p.id] || [])" :key="acc.id"
                         class="p-2.5 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-subtle)] hover:border-[var(--border-bold)] transition-all space-y-1.5 group">
                      <div class="flex items-start justify-between">
                        <div class="min-w-0 pr-1.5">
                          <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                            <span class="font-mono font-bold text-xs text-[var(--text-primary)] truncate max-w-[110px]" :title="acc.handle">
                              {{ acc.handle }}
                            </span>
                            <span v-if="acc.is_primary" class="px-1.5 py-0.2 rounded text-[9px] font-semibold bg-blue-500/15 text-blue-600 dark:text-blue-400 border border-blue-500/30">
                              主号
                            </span>
                            <span v-if="acc.alias" class="px-1.5 py-0.2 rounded text-[9px] bg-[var(--bg-subtle)] text-[var(--text-secondary)] border border-[var(--border-subtle)] truncate max-w-[65px]" :title="acc.alias">
                              {{ acc.alias }}
                            </span>
                          </div>
                          <div class="flex items-center space-x-1.5 mt-1">
                            <span :class="['w-1.5 h-1.5 rounded-full shrink-0', acc.status === 'ok' ? 'bg-emerald-500' : acc.status === 'failed' ? 'bg-rose-500' : 'bg-slate-400']"></span>
                            <span class="text-[10px] text-[var(--text-muted)] truncate max-w-[130px]" :title="acc.status_message">
                              {{ acc.status_message || (acc.last_sync_at ? '已抓取: ' + acc.last_sync_at.slice(0, 10) : '未同步') }}
                            </span>
                          </div>
                        </div>

                        <!-- 操作工具条 -->
                        <div class="flex items-center space-x-0.5 shrink-0">
                          <!-- 设为主号按钮 -->
                          <button v-if="!acc.is_primary" @click="handleSetPrimaryAccount(acc)" title="设为主号"
                                  class="p-1 rounded-md text-[var(--text-tertiary)] hover:text-amber-500 hover:bg-[var(--bg-subtle)] transition-colors">
                            <svg class="w-3.5 h-3.5 stroke-[1.8]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                          </button>
                          <!-- 测试连接按钮 -->
                          <button @click="handleVerifySingleAccount(acc)" :disabled="isAccountTesting[acc.id]" title="测试账号连通性"
                                  class="p-1 rounded-md text-[var(--text-tertiary)] hover:text-blue-500 hover:bg-[var(--bg-subtle)] transition-colors">
                            <svg :class="['w-3.5 h-3.5 stroke-[1.8]', isAccountTesting[acc.id] ? 'animate-spin text-blue-500' : '']" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                            </svg>
                          </button>
                          <!-- 单独同步按钮 -->
                          <button @click="handleSyncSingleAccount(acc)" :disabled="isAccountSyncing[acc.id]" title="抓取此账号题目"
                                  class="p-1 rounded-md text-[var(--text-tertiary)] hover:text-emerald-500 hover:bg-[var(--bg-subtle)] transition-colors">
                            <svg :class="['w-3.5 h-3.5 stroke-[1.8]', isAccountSyncing[acc.id] ? 'animate-spin text-emerald-500' : '']" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                              <polyline points="23 4 23 10 17 10"></polyline>
                              <polyline points="1 20 1 14 7 14"></polyline>
                              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                          </button>
                          <!-- 编辑按钮 -->
                          <button @click="openEditAccountModal(acc)" title="编辑账号与凭据"
                                  class="p-1 rounded-md text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-subtle)] transition-colors">
                            <svg class="w-3.5 h-3.5 stroke-[1.8]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                          </button>
                          <!-- 删除按钮 -->
                          <button @click="handleDeleteAccount(acc)" title="移除账号 (做题记录仍将保留)"
                                  class="p-1 rounded-md text-[var(--text-tertiary)] hover:text-rose-500 hover:bg-[var(--bg-subtle)] transition-colors">
                            <svg class="w-3.5 h-3.5 stroke-[1.8]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                              <polyline points="3 6 5 6 21 6"></polyline>
                              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 卡片底部按钮栏 -->
                <div class="pt-3 border-t border-[var(--border-subtle)] grid grid-cols-2 gap-2">
                  <button @click="openAddAccountModal(p.id)" 
                          class="btn-secondary text-xs py-1.5 flex items-center justify-center space-x-1 w-full">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>添加账号</span>

                      <polyline points="23 4 23 10 17 10"></polyline>
                      <polyline points="1 20 1 14 7 14"></polyline>
                      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span>{{ isVerifying[p.id] ? '同步中...' : '同步全量' }}</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- 系统参数与网络代理 -->
            <div class="p-5 rounded-2xl bg-[var(--bg-subtle)] border border-[var(--border-subtle)] space-y-4 shadow-sm">
              <div class="flex items-center justify-between pb-3 border-b border-[var(--border-subtle)]">
                <div class="flex items-center space-x-2">
                  <svg class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                  </svg>
                  <span class="font-bold text-[var(--text-primary)] text-xs">系统轮询与网络参数</span>
                </div>
                <button @click="saveSystemSettingsOnly" :disabled="isSavingSystem"
                        class="btn-primary text-xs px-3.5 py-1.5 flex items-center space-x-1.5 shadow-sm">
                  <svg :class="['w-3.5 h-3.5', isSavingSystem ? 'animate-spin' : '']" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                  </svg>
                  <span>{{ isSavingSystem ? '正在保存...' : '保存参数' }}</span>
                </button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 text-xs">
                <div>
                  <label class="block text-[var(--text-secondary)] mb-2 text-[11px] font-medium">日常自动轮询同步间隔</label>
                  <!-- 快捷预设按钮 -->
                  <div class="flex flex-wrap items-center gap-1.5 mb-2.5">
                    <button v-for="m in [5, 10, 15, 30, 60]" :key="m"
                            type="button"
                            @click="settingsForm.poll_interval_minutes = m"
                            :class="['px-3 py-1 rounded-xl text-[11px] font-mono font-semibold transition-all border',
                                     String(settingsForm.poll_interval_minutes) === String(m) 
                                     ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
                                     : 'bg-[var(--bg-surface)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] border-[var(--border-subtle)]']">
                      {{ m }}分钟
                    </button>
                  </div>
                  <div class="flex items-center space-x-2">
                    <input v-model.number="settingsForm.poll_interval_minutes" type="number" min="1" max="1440" placeholder="输入自定义分钟数 (1-1440)"
                           class="ui-input font-mono flex-1 text-xs">
                    <span class="text-[var(--text-secondary)] text-xs font-sans">分钟</span>
                  </div>
                  <p class="text-[10px] text-[var(--text-muted)] mt-1.5 font-mono">每 {{ settingsForm.poll_interval_minutes || 30 }} 分钟自动同步</p>
                </div>
                <div>
                  <label class="block text-[var(--text-secondary)] mb-2 text-[11px] font-medium">出站代理 (支持 HTTP / SOCKS5，可选)</label>
                  <input v-model="settingsForm.http_proxy" type="text" placeholder="http://ip:port 或 socks5://ip:port" 
                         class="ui-input font-mono text-xs">
                  <p class="text-[10px] text-[var(--text-muted)] mt-2">海外 VPS 访问限制境外机房 IP 的国内平台（如 AcWing）时使用，国内服务器可留空</p>
                </div>
              </div>
            </div>

            <!-- 账号密码安全设置卡片 (Password Change) -->
            <div class="p-5 rounded-2xl bg-[var(--bg-subtle)] border border-[var(--border-subtle)] space-y-4 shadow-sm">
              <div class="flex items-center space-x-2 pb-3 border-b border-[var(--border-subtle)]">
                <svg class="w-4 h-4 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span class="font-bold text-[var(--text-primary)] text-xs">修改登录密码</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <div>
                  <label class="block text-[var(--text-secondary)] mb-1 text-[11px] font-medium">原密码</label>
                  <input v-model="pwdForm.oldPassword" type="password" placeholder="输入原密码" 
                         class="ui-input font-mono text-xs">
                </div>
                <div>
                  <label class="block text-[var(--text-secondary)] mb-1 text-[11px] font-medium">新密码</label>
                  <input v-model="pwdForm.newPassword" type="password" placeholder="输入新密码 (至少6位)" 
                         class="ui-input font-mono text-xs">
                </div>
                <div>
                  <label class="block text-[var(--text-secondary)] mb-1 text-[11px] font-medium">确认新密码</label>
                  <input v-model="pwdForm.confirmNewPassword" type="password" placeholder="再次输入新密码" 
                         class="ui-input font-mono text-xs">
                </div>
              </div>
              <div class="flex justify-end pt-1">
                <button @click="handleChangePassword" :disabled="isChangingPwd"
                        class="btn-secondary text-xs">
                  {{ isChangingPwd ? '正在修改...' : '确认修改密码' }}
                </button>
              </div>
            </div>

            <!-- 底部保存按钮 -->
            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-[var(--border-subtle)]">
              <button @click="currentTab = 'overview'" class="btn-secondary text-xs">返回总览</button>
              <button @click="saveSettingsAndSync" :disabled="isSaving"
                      class="btn-primary text-xs">
                {{ isSaving ? '正在保存...' : '保存并同步' }}
              </button>
            </div>
          </div>
        </div>

      </main>

    </template>

    <!-- 账号添加 / 编辑浮层弹窗 (Apple 极简模态窗) -->
    <div v-if="accountModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-opacity">
      <div class="w-full max-w-md bg-[var(--bg-surface)] border border-[var(--border-bold)] rounded-2xl shadow-2xl p-6 space-y-5 transform transition-all font-sans">
        <!-- 弹窗标题 -->
        <div class="flex items-center justify-between pb-3 border-b border-[var(--border-subtle)]">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            <h3 class="text-sm font-bold text-[var(--text-primary)]">
              {{ accountModalMode === 'add' ? '添加平台账号' : '编辑平台账号' }}
            </h3>
          </div>
          <button @click="accountModalOpen = false" class="p-1 rounded-lg text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-subtle)] transition-colors">
            <svg class="w-4 h-4 stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- 表单项 -->
        <div class="space-y-4 text-xs">
          <!-- 平台选择 (添加时可选) -->
          <div>
            <label class="block text-[var(--text-secondary)] font-medium mb-1.5">目标平台</label>
            <div class="grid grid-cols-4 gap-2">
              <button v-for="p in platformMetaList" :key="p.id" type="button"
                      :disabled="accountModalMode === 'edit'"
                      @click="accountForm.platform = p.id"
                      :class="['py-2 px-1 text-center rounded-xl border font-medium text-[11px] transition-all',
                               accountForm.platform === p.id 
                               ? 'bg-blue-500/10 border-blue-500 text-blue-600 dark:text-blue-400 shadow-sm' 
                               : 'border-[var(--border-subtle)] bg-[var(--bg-subtle)] text-[var(--text-secondary)] hover:border-[var(--border-bold)]']">
                {{ p.name }}
              </button>
            </div>
          </div>

          <!-- 账号标识 / 用户名 / UID -->
          <div>
            <label class="block text-[var(--text-secondary)] font-medium mb-1.5">
              {{ accountForm.platform === 'luogu' ? '用户 UID (纯数字)' : accountForm.platform === 'acwing' ? '个人空间 ID (纯数字)' : '账号用户名 (Handle)' }}
              <span class="text-rose-500">*</span>
            </label>
            <input v-model="accountForm.handle" type="text"
                   :placeholder="accountForm.platform === 'luogu' ? '如 1940760' : accountForm.platform === 'acwing' ? '如 360946' : accountForm.platform === 'atcoder' ? '如 FarmingWAs' : '如 MCGA_WJJ'"
                   class="ui-input font-mono text-xs w-full">
          </div>

          <!-- Cookie 凭据 (洛谷与 AcWing) -->
          <div v-if="accountForm.platform === 'luogu' || accountForm.platform === 'acwing'">
            <label class="block text-[var(--text-secondary)] font-medium mb-1.5">
              {{ accountForm.platform === 'luogu' ? 'Cookie (__client_id 字段)' : 'Cookie (sessionid 字段)' }}
            </label>
            <input v-model="accountForm.cookie" type="text"
                   :placeholder="accountForm.platform === 'luogu' ? '输入 __client_id' : '输入 sessionid'"
                   class="ui-input font-mono text-xs w-full">
            <p class="text-[10px] text-[var(--text-muted)] mt-1">用于抓取该平台的个人私有提交与做题记录。</p>
          </div>
          <div v-else class="p-2.5 rounded-xl bg-blue-500/5 border border-blue-500/20 text-[11px] text-blue-600 dark:text-blue-400 flex items-center space-x-2">
            <svg class="w-4 h-4 shrink-0 stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>{{ getPlatformName(accountForm.platform) }} 支持公开 API，无需配置 Cookie 即可同步。</span>
          </div>

          <!-- 账号别名 / 备注 -->
          <div>
            <label class="block text-[var(--text-secondary)] font-medium mb-1.5">账号别名 / 备注 (可选)</label>
            <input v-model="accountForm.alias" type="text" placeholder="例如: 大号、刷题小号、被封旧号等"
                   class="ui-input text-xs w-full">
          </div>

          <!-- 是否主账号 -->
          <div class="flex items-center justify-between pt-1">
            <div>
              <span class="font-medium text-[var(--text-primary)]">设为该平台主账号</span>
              <p class="text-[10px] text-[var(--text-muted)]">主账号将作为该平台的首要状态与展示代表</p>
            </div>
            <input type="checkbox" v-model="accountForm.is_primary"
                   class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer">
          </div>
        </div>

        <!-- 弹窗底部操作按钮 -->
        <div class="pt-3 border-t border-[var(--border-subtle)] flex items-center justify-end space-x-2.5">
          <button @click="accountModalOpen = false" type="button" class="btn-secondary text-xs px-4 py-2">
            取消
          </button>
          <button @click="handleSaveAccount" :disabled="isAccountSubmitting" type="button" class="btn-primary text-xs px-5 py-2 flex items-center space-x-1.5">
            <svg v-if="isAccountSubmitting" class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m0 14v1m8-8h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"></path>
            </svg>
            <span>{{ isAccountSubmitting ? '保存中...' : '保存账号' }}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 全局浮动提示 (Toast - Apple Frosted Pill) -->
    <div v-if="toast.show" class="fixed bottom-6 right-6 z-50 px-5 py-3 rounded-2xl shadow-xl text-xs font-semibold border flex items-center space-x-2.5 backdrop-blur-xl transition-all font-sans"
         :class="toast.type === 'success' ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border-emerald-500/30' : 'bg-rose-500/15 text-rose-700 dark:text-rose-300 border-rose-500/30'">
      <svg v-if="toast.type === 'success'" class="w-4 h-4 text-emerald-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <svg v-else class="w-4 h-4 text-rose-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span>{{ toast.message }}</span>
    </div>

  </div>

  <script src="/static/app.js?v=2.6.0"></script>
</body>
</html>
