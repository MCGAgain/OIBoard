    <linearGradient id="ridgeD2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0"/>
      <stop offset="34%" stop-color="#a5b4fc" stop-opacity="0.34"/>
      <stop offset="72%" stop-color="#60a5fa" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="contourD1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="28%" stop-color="#93c5fd" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#5eead4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
