<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Pre-Diffused Deep-Space Titanium Backdrop (Zero sharp lines, zero SVG filters, 0% idle GPU) -->
    <linearGradient id="baseD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Softly Diffused Grazing Light Pools -->
    <radialGradient id="causticCobaltD" cx="16%" cy="14%" r="58%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.50"/>
      <stop offset="46%" stop-color="#1d4ed8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#090e1c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticTealD" cx="84%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.36"/>
      <stop offset="48%" stop-color="#0f766e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090e1c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticIndigoD" cx="42%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#312e81" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <!-- Smooth Ribbon Folds -->
    <linearGradient id="foldD1" x1="10%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.40"/>
      <stop offset="48%" stop-color="#172f62" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#070c17" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="foldD2" x1="100%" y1="12%" x2="18%" y2="92%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#0f2536" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060912" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="foldD3" x1="0%" y1="100%" x2="92%" y2="18%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#1d1b4a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060912" stop-opacity="0"/>
    </linearGradient>

    <!-- Softly Diffused Metallic Crest Halos -->
    <linearGradient id="glowCrestD1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#5eead4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowCrestD2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0"/>
      <stop offset="34%" stop-color="#a5b4fc" stop-opacity="0.18"/>
      <stop offset="72%" stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#baseD)"/>
  <rect width="1920" height="1080" fill="url(#causticCobaltD)"/>
  <rect width="1920" height="1080" fill="url(#causticTealD)"/>
  <rect width="1920" height="1080" fill="url(#causticIndigoD)"/>

  <!-- Smooth Titanium Bevel Planes -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36 L2060,640 C1660,710 1320,432 840,582 C440,706 160,510 -120,650 Z" fill="url(#foldD1)"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564 L-120,1180 L2040,1180 Z" fill="url(#foldD2)"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564 L2060,1180 L-140,1180 Z" fill="url(#foldD3)"/>

  <!-- Broad Diffused Crest Halos -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36" fill="none" stroke="url(#glowCrestD1)" stroke-width="26" stroke-linecap="round" opacity="0.55"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564" fill="none" stroke="url(#glowCrestD2)" stroke-width="24" stroke-linecap="round" opacity="0.5"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564" fill="none" stroke="url(#glowCrestD1)" stroke-width="22" stroke-linecap="round" opacity="0.45"/>
</svg>
