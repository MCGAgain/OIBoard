  <rect width="1920" height="1080" fill="url(#baseD)"/>
  <rect width="1920" height="1080" fill="url(#causticCobaltD)"/>
  <rect width="1920" height="1080" fill="url(#causticTealD)"/>
  <rect width="1920" height="1080" fill="url(#causticIndigoD)"/>

  <!-- Smooth Titanium Bevel Planes -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36 L2060,640 C1660,710 1320,432 840,582 C440,706 160,510 -120,650 Z" fill="url(#foldD1)"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564 L-120,1180 L2040,1180 Z" fill="url(#foldD2)"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564 L2060,1180 L-140,1180 Z" fill="url(#foldD3)"/>

  <!-- Grazing Titanium Crest Edges -->
  <path d="M-120,250 C280,82 660,348 1120,174 C1460,46 1740,118 2060,-36" fill="none" stroke="url(#ridgeD1)" stroke-width="1.15"/>
  <path d="M2040,150 C1640,346 1320,128 880,316 C500,480 220,388 -120,564" fill="none" stroke="url(#ridgeD2)" stroke-width="1.05"/>
  <path d="M-140,764 C260,568 640,862 1140,684 C1520,550 1780,694 2060,564" fill="none" stroke="url(#ridgeD1)" stroke-width="1.05"/>

  <!-- Subtle Geometric Optical Focal Arcs -->
  <g fill="none" stroke="url(#arcFadeD)" stroke-width="0.95">
    <circle cx="1520" cy="220" r="240"/>
    <circle cx="1520" cy="220" r="340"/>
    <circle cx="1520" cy="220" r="440"/>
  </g>

  <!-- Algorithmic Parametric Contour Family -->
  <g fill="none" stroke="url(#contourD1)" stroke-width="1.0">
    <path d="M-80,118 C360,-20 740,256 1220,88 C1560,-30 1800,72 2020,-18"/>
    <path d="M-80,172 C350,28 730,300 1210,136 C1550,20 1790,116 2020,26"/>
    <path d="M-80,226 C340,76 720,344 1200,184 C1540,70 1780,160 2020,70"/>
    <path d="M-80,280 C330,124 710,388 1190,232 C1530,120 1770,204 2020,114"/>
    <path d="M-80,334 C320,172 700,432 1180,280 C1520,170 1760,248 2020,158"/>
  </g>

  <!-- Secondary Counter-Flow Iso-Contours -->
  <g fill="none" stroke="url(#contourD2)" stroke-width="0.95">
    <path d="M-100,822 C320,644 720,922 1200,744 C1560,610 1820,734 2040,624"/>
    <path d="M-100,876 C330,698 730,976 1210,798 C1570,664 1830,788 2040,678"/>
    <path d="M-100,930 C340,752 740,1030 1220,852 C1580,718 1840,842 2040,732"/>
    <path d="M-100,984 C350,806 750,1084 1230,906 C1590,772 1850,896 2040,786"/>
  </g>
</svg>
