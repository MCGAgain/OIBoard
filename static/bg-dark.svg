<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep-Space Obsidian Titanium Backdrop (0% Idle GPU, luminous contour lines for real dark frosted refraction) -->
    <linearGradient id="baseD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <radialGradient id="causticCobaltD" cx="16%" cy="14%" r="58%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.50"/>
      <stop offset="46%" stop-color="#1d4ed8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#090e1c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticTealD" cx="84%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.36"/>
      <stop offset="48%" stop-color="#0f766e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090e1c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticIndigoD" cx="42%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#312e81" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="foldD1" x1="10%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.40"/>
      <stop offset="48%" stop-color="#172f62" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#070c17" stop-opacity="0"/>
