      <stop offset="50%" stop-color="#1d1b4a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060912" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ridgeD1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="28%" stop-color="#93c5fd" stop-opacity="0.42"/>
      <stop offset="68%" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
