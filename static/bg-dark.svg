    <linearGradient id="contourD2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0"/>
      <stop offset="32%" stop-color="#a5b4fc" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="arcFadeD" cx="78%" cy="22%" r="36%">
